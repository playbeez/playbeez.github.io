 const nm=k=>(S.pl[k]||{}).name||"bee";
 function conv(){const q=$("#msq").value.trim().toLowerCase();
  if(q){const us=Object.keys(S.pl).filter(k=>k!==me&&nm(k).toLowerCase().includes(q)).slice(0,10);$("#mcv").innerHTML=us.map(k=>'<a href="?to='+k+'">'+beeSvg(S.pl[k].bee,34)+'<span><b>'+esc(nm(k))+'</b></span></a>').join("")||'<div class="pmsg" style="padding:16px;color:var(--mute)">no bees found.</div>';return}

  $("#mcv").innerHTML=ks.map(k=>{const v=inb[k],un=v.seen===false;return'<a href="?to='+k+'" class="'+(k===to?"on":"")+'">'+beeSvg((S.pl[k]||{}).bee,34)+'<span><b class="'+(un?"un":"")+'">'+esc(nm(k))+'</b><small>'+(v.u===me?"you: ":"")+esc(v.t||"")+'</small></span>'+(un?'<i class="dot"></i>':"")+'</a>'}).join("")||'<div class="pmsg" style="padding:16px;color:var(--mute)">no conversations yet. search for a bee above to say hi.</div>'}
 $("#msq").oninput=conv;
 D.onValue(R("inbox/"+me),s=>{inb=s.val()||{};conv();if(to&&inb[to]&&inb[to].seen===false)D.set(R("inbox/"+me+"/"+to+"/seen"),true).catch(()=>{})},()=>{conv()});
 if(!to){$("#mth").innerHTML='<div class="pmsg" style="margin:auto;color:var(--mute);padding:20px;text-align:center">pick a conversation or search for a bee to message.</div>';return}
 if(to===me){$("#mth").innerHTML='<div class="pmsg" style="margin:auto;color:var(--mute)">you can’t message yourself.</div>';return}
 const p=S.pl[to];
 $("#mth").innerHTML='<div class="th1"><a class="chip back" href="./" style="text-decoration:none" aria-label="back">'+S.ic("back",false,16)+'</a><a href="'+ROOT+'user/?id='+to+'">'+beeSvg((p||{}).bee,36)+'</a><a class="ulink" href="'+ROOT+'user/?id='+to+'"><b>'+esc(p?p.name:"bee")+'</b></a></div><div class="tm" id="tm"></div><div class="tf"><button class="pi" id="mem" type="button" aria-label="emoji">'+S.ic("smile")+'</button><input class="f" id="mi" maxlength="1000" placeholder="write a message" autocomplete="off"><button class="big" id="ms" style="margin:0;padding:9px 18px" aria-label="send">'+S.ic("send")+'</button></div>';
 const tm=$("#tm");
 D.onValue(D.query(R("dms/"+pair(to)),D.limitToLast(150)),s=>{const a=[];s.forEach(c=>{a.push(c.val()||{})});a.sort((x,y)=>(x.ts||0)-(y.ts||0));tm.innerHTML=a.map(m=>'<div class="bub'+(m.u===me?" me":"")+'">'+S.fmt(m.t)+'<small>'+S.ago(m.ts)+'</small></div>').join("")||'<div class="pmsg" style="margin:auto;color:var(--mute)">say hi.</div>';tm.scrollTop=tm.scrollHeight},()=>{tm.innerHTML='<div class="pmsg" style="margin:auto;color:var(--mute)">couldn’t load messages.</div>'});
 const send=async()=>{const t=$("#mi").value.trim();if(!t||!S.can())return;$("#mi").value="";const ts=Date.now(),pv=t.slice(0,60);
  try{await D.push(R("dms/"+pair(to)),{u:me,t:t.slice(0,1000),ts});await D.set(R("inbox/"+me+"/"+to),{t:pv,ts,u:me,seen:true});await D.set(R("inbox/"+to+"/"+me),{t:pv,ts,u:me,seen:false})}catch(e){toast("couldn’t send. verify your email?");$("#mi").value=t}};
 $("#mem").onclick=e=>{e.stopPropagation();S.picker(e.currentTarget,$("#mi"))};$("#ms").onclick=send;$("#mi").onkeydown=e=>{if(e.key==="Enter")send()}});
