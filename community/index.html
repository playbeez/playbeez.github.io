 function list(){const ks=Object.keys(S.cm).sort((a,b)=>mc(b)-mc(a)||(S.cm[b].ts||0)-(S.cm[a].ts||0));
  root.innerHTML='<h2>community</h2><p class="sub">groups for bees with something in common.</p><div class="bar2"><button class="chip" id="cnew">create a community</button></div><div class="comp hide" id="cform"><div class="lbl" style="margin:0">icon</div><div class="ipk" id="cip"></div><div class="lbl" style="margin:0">color</div><div class="ipk cols" id="ccp"></div><input class="f" id="cn" maxlength="30" placeholder="community name"><textarea class="f" id="cd" maxlength="160" rows="2" placeholder="what is it about?"></textarea><div class="crow"><small class="mono" style="color:var(--mute)">name 2 to 30 letters</small><button class="big" id="cmk" style="margin:0;padding:9px 22px">create</button></div></div><div class="cgrid" id="cg"></div>';
  let ci="hex",ck=0;const pickUI=()=>{$("#cip").innerHTML=Object.keys(S.CI).map(k=>'<button type="button" data-i="'+k+'" class="'+(k===ci?"on":"")+'" aria-label="'+k+'"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+S.CI[k]+'</svg></button>').join("");$("#ccp").innerHTML=S.CCOL.map((c,i)=>'<button type="button" data-k="'+i+'" class="'+(i===ck?"on":"")+'" style="background:'+c+'" aria-label="color '+(i+1)+'"></button>').join("");$$("#cip button").forEach(x=>x.onclick=()=>{ci=x.dataset.i;pickUI()});$$("#ccp button").forEach(x=>x.onclick=()=>{ck=+x.dataset.k;pickUI()})};pickUI();
  $("#cnew").onclick=()=>{if(!S.can())return;$("#cform").classList.toggle("hide")};
  $("#cmk").onclick=async()=>{const n=$("#cn").value.trim(),d=$("#cd").value.trim();if(n.length<2){toast("name is too short");return}$("#cmk").disabled=true;try{const r=D.push(R("communities"));await D.set(r,{o:S.u.uid,n,d,ts:Date.now(),i:ci,k:ck});await D.set(R("members/"+r.key+"/"+S.u.uid),true);location.href="?c="+r.key}catch(e){toast("couldn’t create. verify your email?");$("#cmk").disabled=false}};
  $("#cg").innerHTML=ks.map(k=>{const c=S.cm[k];return'<div class="cc"><div style="display:flex;gap:10px;align-items:center">'+S.cic(c,40)+'<h3><a class="ulink" href="?c='+k+'">'+esc(c.n)+'</a></h3></div><p>'+esc(c.d||"no description yet.")+'</p><div class="mt"><span>'+S.ic("users",false,15)+' '+mc(k)+' member'+(mc(k)===1?"":"s")+'</span><button class="chip jn" data-k="'+k+'">'+(isM(k)?"joined":"join")+'</button></div></div>'}).join("")||'<div class="pmsg" style="color:var(--mute);padding:30px 0">no communities yet. start the first one.</div>';
  $$(".jn").forEach(b=>b.onclick=()=>join(b.dataset.k,!isM(b.dataset.k)))}
 async function view(){const c=S.cm[cid];if(!c){root.innerHTML='<a class="chip" href="./" style="display:inline-flex;gap:6px;align-items:center;text-decoration:none">'+S.ic("back",false,16)+'all communities</a><div class="pmsg" style="padding:30px 0;color:var(--mute)">this community doesn’t exist.</div>';return}
  const own=S.u&&c.o===S.u.uid,ow=S.pl[c.o]||{};
  root.innerHTML='<a class="chip" href="./" style="display:inline-flex;gap:6px;align-items:center;text-decoration:none;margin-bottom:14px">'+S.ic("back",false,16)+'all communities</a><div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">'+S.cic(c,56)+'<h2 style="margin:0">'+esc(c.n)+'</h2></div><p class="sub">'+esc(c.d||"")+'</p><div class="bar2"><span style="color:var(--mute);font-size:14px">'+S.ic("users",false,15)+' '+mc(cid)+' member'+(mc(cid)===1?"":"s")+' · made by <a class="ulink" href="'+ROOT+'user/?id='+c.o+'">'+esc(ow.name||"bee")+'</a></span><button class="chip" id="cj">'+(isM(cid)?"leave":"join")+'</button>'+((own||S.admin)?'<button class="chip" id="cdel">delete</button>':"")+'</div><div id="ccomp"></div><div id="cfeed"></div>';
  $("#cj").onclick=()=>join(cid,!isM(cid));
  const cd=$("#cdel");if(cd)cd.onclick=async()=>{if(!confirm("delete this community?"))return;try{await D.remove(R("communities/"+cid));location.href="./"}catch(e){toast("couldn’t delete")}};
  S.composer($("#ccomp"),{c:cid,ph:"post to "+c.n,gate:()=>{if(!isM(cid)){toast("join the community to post");return false}return true},done:feed});
  feed();
  async function feed(){let rows=[];try{const s=await D.get(D.query(R("posts"),D.orderByChild("c"),D.equalTo(cid)));s.forEach(x=>{rows.push([x.key,x.val()])});rows.sort((a,b)=>(b[1].ts||0)-(a[1].ts||0))}catch(e){}S.mount($("#cfeed"),rows,{nocomm:true,empty:"no posts here yet."})}}
 draw()});

</script>
</body>
</html>
